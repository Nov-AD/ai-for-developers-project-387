name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  # Serialize requests for the same issue or PR, including diff comments.
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot' &&
      !endsWith(github.event.comment.user.login, '[bot]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    steps:
      - name: Verify discussion access and PR trust
        id: discussion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISCUSSION_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
        run: |
          if [[ "$IS_PULL_REQUEST" == "true" ]]; then
            is_fork="$(gh pr view "$DISCUSSION_NUMBER" --repo "$GH_REPO" --json isCrossRepository --jq .isCrossRepository)"
            if [[ "$is_fork" != "false" ]]; then
              echo "::notice::OpenCode does not run on fork PRs."
              exit 0
            fi
            gh pr view "$DISCUSSION_NUMBER" --repo "$GH_REPO" --json number,title,body,labels,comments,reviews > /dev/null
            gh api --paginate "repos/$GH_REPO/pulls/$DISCUSSION_NUMBER/comments" > /dev/null
          else
            gh issue view "$DISCUSSION_NUMBER" --repo "$GH_REPO" --json number,title,body,labels,comments > /dev/null
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.discussion.outputs.allowed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute a PR's code before the agent has reviewed the request.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up project tools
        if: steps.discussion.outputs.allowed == 'true'
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      - name: Prepare project skills
        if: steps.discussion.outputs.allowed == 'true'
        shell: bash
        run: |
          pnpm skills:check
          # Keep skills available when OpenCode switches to an older PR branch.
          mkdir -p "$HOME/.config/opencode/skills"
          cp -R .opencode/skills/. "$HOME/.config/opencode/skills/"

      - name: Run OpenCode
        if: steps.discussion.outputs.allowed == 'true'
        # github-v1.2.25; @latest is stale, see anomalyco/opencode#19865.
        uses: anomalyco/opencode/github@a3b97d9090ccf4aa9ac32268486283e3131e36b4
        env:
          # App authentication stays in the Action; shell gh needs its own token.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_PROMPT_DISABLED: "1"
          # There is no interactive client to answer filesystem approval requests.
          # This GitHub Action installs V1: its policy must use singular "permission".
          OPENCODE_CONFIG_CONTENT: >-
            {"$schema":"https://opencode.ai/config.json","permission":{
            "external_directory":"deny",
            "read":{"*.env":"deny","*.env.*":"deny"}}}
        with:
          model: opencode/deepseek-v4.1-flash-free
          mentions: /opencode,/oc
          share: true
