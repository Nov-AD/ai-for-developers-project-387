name: Security

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      training:
        description: Add a clearly marked training finding only if OSV finds no vulnerabilities
        type: boolean
        default: false

permissions: {}

concurrency:
  group: security
  cancel-in-progress: false

jobs:
  audit:
    name: Dependency audit agent
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Keep reports outside the checkout
        run: echo "AUDIT_DIR=$RUNNER_TEMP/dependency-audit" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      - name: Scan all dependency lockfiles with OSV
        env:
          AUDIT_TRAINING: ${{ inputs.training || false }}
        run: node scripts/dependency-audit.mjs scan

      - name: Install locked OpenCode V2 CLI
        run: npm ci --prefix .github/auto-triage

      - name: Analyze report without credentials or mutation tools
        env:
          AUDIT_CLI: ${{ github.workspace }}/.github/auto-triage/node_modules/.bin/opencode
        run: node scripts/dependency-audit.mjs analyze

      - name: Create finding issues, reusing existing open or closed issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dependency-audit.mjs publish

      - name: Add audit report to the run summary
        if: always()
        run: |
          if [[ -f "$AUDIT_DIR/report.md" ]]; then
            cat "$AUDIT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save scanner report, agent output and publication results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_DIR }}/
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9

      - name: Scan the Git history for secrets
        run: mise run secrets
