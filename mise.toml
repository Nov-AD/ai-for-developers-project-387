# Development environment for the call calendar.
# Every tool used by install, run, build and check tasks is pinned here.
# `mise install --locked` installs exactly the versions recorded in mise.lock.

[settings]
experimental = true
lockfile = true

[tools]
node = "24.11.1"
pnpm = "12.21.0"
hk = "2.12.0"
pitchfork = "2.34.0"
# Quality gates that are distributed as standalone binaries.
jactionlint = "2.6.0"
betterleaks = "1.10.1"
osv-scanner = "2.7.1"
vacuum = "0.41.0"
"github:oasdiff/oasdiff" = "1.38.0"

[env]
NODE_ENV = "development"
# Expose workspace-installed executables to Git hooks and ad-hoc commands.
_.path = ["node_modules/.bin"]

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

[tasks.install]
description = "Install JavaScript dependencies from the lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.setup]
description = "Install dependencies and repository Git hooks"
depends = ["install"]
run = "hk install --mise"

[tasks.codegen]
description = "Generate OpenAPI, SDK and server types from the TypeSpec contract"
run = "pnpm codegen"

[tasks.build]
description = "Generate artifacts and build every package"
run = "pnpm build"

[tasks.lint]
description = "Lint TypeScript and GitHub Actions workflows"
run = "pnpm lint && pnpm lint:actions"

[tasks.fmt]
description = "Format code with oxfmt"
run = "pnpm fmt"

[tasks."fmt:check"]
description = "Check formatting with oxfmt"
run = "pnpm fmt:check"

[tasks.knip]
description = "Find unused files, exports and dependencies"
run = "pnpm knip"

[tasks.syncpack]
description = "Check dependency versions across the monorepo"
run = "pnpm syncpack"

[tasks.arch]
description = "Check package boundaries and import cycles"
run = "pnpm arch"

[tasks."contract:lint"]
description = "Lint the generated OpenAPI specification"
run = "pnpm contract:lint"

[tasks."contract:breaking"]
description = "Fail on breaking OpenAPI changes against the base branch"
run = "pnpm contract:breaking"

[tasks.typecheck]
description = "Type-check every package"
run = "pnpm typecheck"

[tasks.test]
description = "Run API and React component test suites"
run = "pnpm test"

[tasks."test:e2e"]
description = "Install Chromium, build and run the browser scenario against the real app"
run = "pnpm test:e2e"

[tasks.smoke]
description = "Run the API smoke test"
run = "pnpm test:smoke"

[tasks.secrets]
description = "Scan the Git history for committed secrets"
run = "pnpm secrets"

[tasks.audit]
description = "Scan dependencies for known vulnerabilities"
run = "pnpm audit"

# The single entry point for local checks, Git hooks and CI.
# It installs dependencies, then runs every hermetic check in order.
[tasks.check]
description = "Install dependencies and run every check"
depends = ["install"]
run = "pnpm check"

[tasks.fix]
description = "Apply safe automatic fixes"
run = "pnpm fix"

# ---------------------------------------------------------------------------
# Hooks
# ---------------------------------------------------------------------------

[hooks]
# After `mise install`, make sure JavaScript dependencies are present.
postinstall = { task = "install" }
# When an activated shell enters the project, refresh dependencies and hooks.
enter = { task = "setup" }

# ---------------------------------------------------------------------------
# Development services
# ---------------------------------------------------------------------------

[daemons.api]
run = "exec pnpm --filter @calendar/api dev"
port = 3000
ready_port = 3000

[daemons.web]
# The web app imports the generated SDK from packages/sdk/dist.
init = ["pnpm --filter @calendar/sdk build"]
run = "exec pnpm --filter @calendar/web dev"
port = 5173
ready_port = 5173
depends = ["api"]

[daemon_groups]
default = ["api", "web"]

[tasks.dev]
description = "Start the API and web daemons and show their status"
daemons = ["api", "web"]
run = "mise daemons status"
